name: Android Build

# Builds the Dijah's Delights Candy Run Android APK in the cloud with barichello/godot-ci.
# Runs on every push to main and on version tags (v1.0.0 etc.).
# Tag pushes also publish a GitHub Release with the APK attached.
# No secrets needed: the debug keystore is generated in the job and the
# release uses the automatic GITHUB_TOKEN.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/4.2.2.stable ~/.local/share/godot/export_templates/4.2.2.stable || true

      - name: Generate debug keystore
        working-directory: godot-project
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey \
              -keypass android -keystore debug.keystore -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" -validity 9999 \
              -deststoretype pkcs12
          fi

      - name: Import project
        run: godot --headless --import --path godot-project --audio-driver Dummy --verbose

      - name: Export Android APK (debug)
        run: godot --headless --path godot-project --export-debug "Android" godot-project/dijah-dash.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dijah-dash-apk
          path: godot-project/dijah-dash.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: godot-project/dijah-dash.apk
          generate_release_notes: true
