name: Android Build

# Builds the Dijah's Delights Candy Run Android APK in the cloud with barichello/godot-ci.
# Runs on every push to main and on version tags (v1.0.0 etc.).
# Tag pushes also publish a GitHub Release with the APK attached.
# No secrets needed: the debug keystore is generated in the job and the
# release uses the automatic GITHUB_TOKEN.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/4.2.2.stable ~/.local/share/godot/export_templates/4.2.2.stable || true

      - name: Generate debug keystore
        working-directory: godot-project
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey \
              -keypass android -keystore debug.keystore -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" -validity 9999 \
              -deststoretype pkcs12
          fi

      - name: Import project
        run: godot --headless --import --path godot-project --audio-driver Dummy --verbose

      # Godot 4 reads editor_settings-4.tres (major version only) — the
      # earlier fix wrote editor_settings-4.2.tres, a file Godot never
      # reads, which is why the export still said no Java SDK path.
      # Write both filenames to be safe.
      - name: Configure Java SDK path
        run: |
          JDK_PATH=$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")
          echo "JDK found at: $JDK_PATH"
          ls "$JDK_PATH/bin/javac"
          for SETTINGS in "$HOME/.config/godot/editor_settings-4.tres" "$HOME/.config/godot/editor_settings-4.2.tres"; do
            mkdir -p "$(dirname "$SETTINGS")"
            if [ ! -f "$SETTINGS" ]; then
              printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$SETTINGS"
            fi
            if grep -q '^export/android/java_sdk_path' "$SETTINGS"; then
              sed -i "s|^export/android/java_sdk_path.*|export/android/java_sdk_path = \"$JDK_PATH\"|" "$SETTINGS"
            else
              printf 'export/android/java_sdk_path = "%s"\n' "$JDK_PATH" >> "$SETTINGS"
            fi
            echo "--- $SETTINGS ---"
            grep 'java_sdk_path' "$SETTINGS"
          done

      - name: Export Android APK (debug)
        run: godot --headless --path godot-project --export-debug "Android" godot-project/dijah-dash.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dijah-dash-apk
          path: godot-project/dijah-dash.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: godot-project/dijah-dash.apk
          generate_release_notes: true
